<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الـ APIs - منصة التكامل الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* نفس الأسلوب السابق مع إضافات */
        .quick-links {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,255,136,0.1);
            border-radius: 8px;
        }
        .quick-links a {
            color: #FFD700;
            text-decoration: none;
            margin: 0 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- نفس الكود السابق حتى لوحة الـ APIs -->
    <div class="container">
        <div class="header">
            <h1>⚙️ إعدادات الـ APIs</h1>
            <p>ربط جميع الخدمات الخارجية للمنصة</p>
        </div>
        
        <div class="quick-links">
            <a href="/whatsapp-qr.html">📱 ربط WhatsApp (QR Code)</a>
        </div>
        
        <!-- Facebook API -->
        <div class="api-grid">
            <!-- نفس كود Facebook السابق -->
            <div class="api-card">
                <h2>📘 Facebook Messenger API</h2>
                <div class="form-group">
                    <label>Page Access Token <span class="status-indicator status-disconnected" id="fb-status"></span></label>
                    <input type="password" id="fb-token" placeholder="EAABsi...">
                    <button class="btn-test" onclick="connectFacebook()">🔐 تسجيل دخول حقيقي</button>
                </div>
                <!-- باقي الحقول -->
            </div>
            
            <!-- WhatsApp API -->
            <div class="api-card">
                <h2>💬 WhatsApp Business API</h2>
                <div class="form-group">
                    <label>Session Status <span id="wa-session-status"></span></label>
                    <button class="btn-test" onclick="window.location.href='/whatsapp-qr.html'">📱 فتح QR Scanner</button>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="wa-phone" readonly placeholder="سيتم ملؤه تلقائياً">
                </div>
            </div>
            
            <!-- AI Bot API -->
            <div class="api-card">
                <h2>🤖 AI Bot Integration</h2>
                <div class="form-group">
                    <label>API Key <span class="status-indicator status-disconnected" id="bot-status"></span></label>
                    <input type="password" id="bot-api-key" placeholder="sk-...">
                    <button class="btn-test" onclick="testAI()">🧪 اختبار الذكاء</button>
                </div>
                <div class="form-group">
                    <label>Model</label>
                    <select id="bot-model">
                        <option value="gpt-4">GPT-4 (أذكى)</option>
                        <option value="gpt-3.5-turbo">GPT-3.5 Turbo (أسرع)</option>
                    </select>
                </div>
            </div>
            
            <!-- Gmail API -->
            <div class="api-card">
                <h2>📧 Gmail Integration</h2>
                <div class="form-group">
                    <label>Gmail Account <span class="status-indicator status-disconnected" id="gmail-status"></span></label>
                    <input type="email" id="gmail-email" placeholder="your@gmail.com">
                    <button class="btn-test" onclick="connectGmail()">🔐 تسجيل دخول Gmail</button>
                </div>
                <div class="form-group">
                    <label>OAuth Token</label>
                    <textarea id="gmail-token" rows="3" readonly placeholder="سيتم ملؤه تلقائياً بعد تسجيل الدخول"></textarea>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ربط Facebook حقيقي
        async function connectFacebook() {
            const btn = event.target;
            btn.textContent = '⏳ جاري الاتصال...';
            
            // محاكاة OAuth
            const token = prompt('أدخل Page Access Token من Facebook Developer Console:');
            if (token) {
                document.getElementById('fb-token').value = token;
                localStorage.setItem('api_facebook', JSON.stringify({ token }));
                updateStatus('fb', true);
                btn.textContent = '✅ متصل';
                addLog('Facebook', 'تم ربط Facebook بنجاح');
            } else {
                btn.textContent = '❌ فشل الاتصال';
            }
        }
        
        // ربط Gmail حقيقي
        async function connectGmail() {
            const btn = event.target;
            btn.textContent = '⏳ جاري التوجيه...';
            
            // محاكاة OAuth
            window.open('https://accounts.google.com/o/oauth2/v2/auth?scope=https://www.googleapis.com/auth/gmail.send&response_type=token&redirect_uri=urn:ietf:wg:oauth:2.0:oob&client_id=YOUR_CLIENT_ID', '_blank');
            
            const token = prompt('أدخل الـ Token من نافذة Google:');
            if (token) {
                document.getElementById('gmail-token').value = token.substring(0, 50) + '...';
                updateStatus('gmail', true);
                btn.textContent = '✅ متصل';
                addLog('Gmail', 'تم ربط Gmail بنجاح');
            }
        }
        
        // اختبار الذكاء الصناعي
        async function testAI() {
            const btn = event.target;
            const key = document.getElementById('bot-api-key').value;
            
            if (!key) {
                alert('أدخل مفتاح API أولاً!');
                return;
            }
            
            btn.textContent = '⏳ يختبر...';
            
            try {
                AIEngine.config.apiKey = key;
                const result = await AIEngine.testConnection();
                
                if (result.success) {
                    updateStatus('bot', true);
                    btn.textContent = '✅ متصل';
                    alert('🧠 الذكاء الصناعي متصل ويعمل!');
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                btn.textContent = '❌ فشل';
                alert('خطأ: ' + error.message);
            }
        }
        
        function updateStatus(api, status) {
            const indicator = document.getElementById(`${api}-status`);
            if (indicator) {
                indicator.className = `status-indicator ${status ? 'status-connected' : 'status-disconnected'}`;
            }
        }
        
        function addLog(service, message) {
            // نفس دالة السجل
        }
    </script>
</body>
</html>
