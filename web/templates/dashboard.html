<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - Last.bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h2>🤖 Last.bot</h2>
            <ul class="nav-menu">
                <li><a href="/dashboard">الرئيسية</a></li>
                <li><a href="/api/docs">API</a></li>
                <li><a href="/logout">تسجيل خروج</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>📱 حالة WhatsApp</h3>
                <p class="status active">متصل ✅</p>
            </div>
            
            <div class="stat-card">
                <h3>🤖 حالة الذكاء الاصطناعي</h3>
                <p class="status active">نشط ✅</p>
            </div>
            
            <div class="stat-card">
                <h3>📊 الرسائل اليوم</h3>
                <p class="number">0</p>
            </div>
        </div>
        
        <div class="action-panel">
            <h2>إجراءات سريعة</h2>
            <button onclick="sendTestMessage()">إرسال رسالة اختبار</button>
            <button onclick="reloadBot()">إعادة تشغيل البوت</button>
        </div>
    </div>
</body>
</html>
